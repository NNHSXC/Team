<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NNHS Girls XC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#002F55; --blue-700:#013a69; --blue-300:#3f6e98;
  --orange:#FF4800; --orange-soft:#ff6a33;
  --gray:#ACA89F; --gray-soft:#d9d6cf;
  --paper:#f7f4ef; --paper-2:#fffdf9; --card:#ffffff;
  --ink:#11233a; --ink-soft:#54667b;
  --green:#1f7a4d; --green-soft:#e3f1ea;
  --line:#e7e2d8;
  --practice:#1f6fb2; --meet:#FF4800; --team:#1f7a4d; --other:#8f8b82;
  --shadow:0 1px 2px rgba(0,30,60,.06),0 6px 20px rgba(0,30,60,.07);
  --shadow-lg:0 10px 40px rgba(0,30,60,.18);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;padding-bottom:84px;min-height:100vh;
  background-image:radial-gradient(circle at 12% -5%,rgba(255,72,0,.05),transparent 40%),radial-gradient(circle at 90% 0%,rgba(0,47,85,.06),transparent 38%);
}
.wrap{max-width:540px;margin:0 auto;padding:0 16px}

/* Header */
header{
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-700) 100%);
  color:#fff;padding:18px 0 16px;position:relative;overflow:hidden;
}
header::after{content:"";position:absolute;right:-40px;top:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,72,0,.35),transparent 70%)}
header .wrap{position:relative;z-index:1}
.brandrow{display:flex;align-items:center;gap:12px}
.crest{width:42px;height:42px;border-radius:11px;background:var(--orange);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:900;font-size:20px;color:#fff;box-shadow:0 4px 12px rgba(255,72,0,.4);flex:none}
.brandtext h1{font-family:'Fraunces',serif;font-weight:900;font-size:19px;margin:0;letter-spacing:.2px;line-height:1.05}
.brandtext p{margin:2px 0 0;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#bcd0e4;font-weight:600}

/* Greeting / identity chip */
.idchip{margin-top:14px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:9px 12px;border-radius:13px;backdrop-filter:blur(4px)}
.idchip .who{font-size:13.5px;font-weight:600;flex:1}
.idchip .who span{color:#bcd0e4;font-weight:500}
.idchip button{background:rgba(255,255,255,.16);border:none;color:#fff;font-family:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:9px;cursor:pointer}
.idchip button:active{transform:scale(.96)}

/* Page area */
main{padding-top:18px;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pagetitle{font-family:'Fraunces',serif;font-weight:700;font-size:24px;margin:0 0 2px}
.pagesub{color:var(--ink-soft);font-size:13px;margin:0 0 16px}

/* Calendar */
.calbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calbar h2{font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin:0}
.calnav{display:flex;gap:8px}
.calnav button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--blue);font-size:17px;cursor:pointer;display:grid;place-items:center}
.calnav button:active{background:var(--paper)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.dow div{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;padding:3px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{aspect-ratio:1/1.05;border-radius:11px;background:var(--card);border:1px solid var(--line);padding:4px 3px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .08s,box-shadow .15s}
.cell.empty{background:transparent;border:1px solid transparent;cursor:default}
.cell.today{border-color:var(--orange);box-shadow:0 0 0 1.5px var(--orange)}
.cell:not(.empty):active{transform:scale(.95)}
.cell .num{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.4}
.cell.today .num{color:var(--orange);font-weight:800}
.cell.faded .num{color:var(--gray)}
.dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.practice{background:var(--practice)}.dot.meet{background:var(--meet)}.dot.team{background:var(--team)}.dot.other{background:var(--other)}
.themebadge{position:absolute;top:2px;right:3px;font-size:8px}
.cell .miniev{width:100%;margin-top:2px;display:flex;flex-direction:column;gap:2px}
.cell .evpill{font-size:7.5px;line-height:1.1;padding:1px 2px;border-radius:3px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.evpill.practice{background:var(--practice)}.evpill.meet{background:var(--meet)}.evpill.team{background:var(--team)}.evpill.other{background:var(--other)}

.legend{display:flex;gap:13px;flex-wrap:wrap;margin:14px 2px 0;font-size:11.5px;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Full screen day view */
.dayview{position:fixed;inset:0;background:var(--paper);z-index:50;overflow-y:auto;animation:slideup .28s cubic-bezier(.2,.7,.3,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.dvhead{background:linear-gradient(135deg,var(--blue),var(--blue-700));color:#fff;padding:16px 0 18px;position:sticky;top:0;z-index:2}
.dvhead .wrap{display:flex;align-items:flex-start;gap:12px}
.dvback{background:rgba(255,255,255,.16);border:none;color:#fff;width:38px;height:38px;border-radius:11px;font-size:18px;cursor:pointer;flex:none}
.dvback:active{transform:scale(.94)}
.dvdate{flex:1}
.dvdate .d1{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#bcd0e4;font-weight:600}
.dvdate .d2{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin-top:1px}
.dvtheme{display:inline-flex;align-items:center;gap:5px;margin-top:8px;background:var(--orange);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}

.evcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.evtop{padding:14px 16px;border-left:5px solid var(--practice);display:flex;align-items:flex-start;gap:10px}
.evtop.practice{border-color:var(--practice)}.evtop.meet{border-color:var(--meet)}.evtop.team{border-color:var(--team)}.evtop.other{border-color:var(--other)}
.evtag{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;align-self:center;flex:none}
.evtag.practice{background:var(--practice)}.evtag.meet{background:var(--meet)}.evtag.team{background:var(--team)}.evtag.other{background:var(--other)}
.evtitle{flex:1}
.evtitle h3{margin:0;font-size:16.5px;font-weight:700;font-family:'Fraunces',serif}
.evtitle .tm{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-weight:500}
.updated{display:inline-block;margin-left:6px;font-size:9px;font-weight:800;color:var(--orange);border:1px solid var(--orange);border-radius:5px;padding:1px 5px;vertical-align:middle;letter-spacing:.04em}
.evbody{padding:0 16px 15px}
.metarow{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);padding:9px 0;border-top:1px solid var(--line)}
.metarow .ic{color:var(--orange);font-size:14px;width:17px;text-align:center;flex:none}
.mapbtn,.cmapbtn{margin-left:auto;background:var(--blue);color:#fff;text-decoration:none;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:8px}
.section-h{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--blue-300);margin:14px 0 7px}
.sched{list-style:none;padding:0;margin:0}
.sched li{display:flex;gap:10px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.sched li:last-child{border-bottom:none}
.sched .t{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;flex:none;min-width:52px}
.notes{margin:0;padding-left:18px}
.notes li{font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;line-height:1.45}
.race{list-style:none;padding:0;margin:0}
.race li{font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line);font-weight:500}
.evimg{width:100%;border-radius:11px;margin-top:12px;border:1px solid var(--line)}
.resbtns{display:flex;flex-wrap:wrap;gap:8px}
.resbtn{display:block;background:var(--paper-2);border:1.5px solid var(--blue);color:var(--blue);text-decoration:none;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:10px}
.resbtn:active{background:var(--blue);color:#fff}

/* attendance block inside day */
.attnblock{background:linear-gradient(180deg,#fff,var(--paper-2));border:1.5px dashed var(--gray);border-radius:var(--r);padding:14px 16px;margin-bottom:30px}
.attnblock h4{margin:0 0 4px;font-size:14px;font-family:'Fraunces',serif;font-weight:700}
.attnblock .lead{font-size:12.5px;color:var(--ink-soft);margin:0 0 11px}
.attn-status{display:flex;align-items:center;gap:9px;background:var(--green-soft);border-radius:11px;padding:11px 13px;margin-bottom:10px}
.attn-status.absent{background:#fdeee8}
.attn-status .big{font-size:18px}
.attn-status .txt{font-size:13px;font-weight:600;flex:1}
.attn-status .txt small{display:block;font-weight:500;color:var(--ink-soft);font-size:11.5px;margin-top:1px}
.attn-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:inherit;border:none;cursor:pointer;font-weight:700;border-radius:10px;font-size:12.5px;padding:9px 13px}
.btn-o{background:var(--orange);color:#fff}.btn-o:active{background:var(--orange-soft)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-sm{padding:6px 10px;font-size:11.5px}

/* generic cards / lists */
.lbcard,.linkcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.lbcard{display:flex;align-items:center;gap:12px}
.lbcard .lbinfo{flex:1}
.lbcard h3{margin:0;font-size:15px;font-weight:700}
.lbcard .due{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.lbcard .due.past{color:var(--orange);font-weight:700}
.lbcard .lbactions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.openbtn{background:var(--blue);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:7px 13px;border-radius:9px;white-space:nowrap}
.checkbtn{background:var(--paper);border:1.5px solid var(--line);color:var(--ink-soft);font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.checkbtn.done{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.linkcard{display:flex;align-items:center;gap:13px}
.linkcard .lk{width:42px;height:42px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.linkcard .lk.orange{background:var(--orange)}
.linkcard .lkinfo{flex:1}
.linkcard h3{margin:0;font-size:14.5px;font-weight:700}
.linkcard p{margin:1px 0 0;font-size:12px;color:var(--ink-soft)}
.linkcard .arrow{color:var(--gray);font-size:18px}
a.bare{text-decoration:none;color:inherit}

/* My Attendance page */
.myabs{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 15px;margin-bottom:11px;display:flex;align-items:center;gap:11px}
.myabs .tag{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;padding:3px 8px;border-radius:6px;flex:none}
.tag.absent{background:var(--orange)}.tag.late{background:#b8860b}.tag.early{background:#7a5cc0}
.myabs .info{flex:1}
.myabs .info .dt{font-size:13.5px;font-weight:700}
.myabs .info .rs{font-size:12px;color:var(--ink-soft);margin-top:1px}
.myabs.cancelled{opacity:.55}
.myabs.cancelled .info .dt{text-decoration:line-through}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,249,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.navinner{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.navbtn{border:none;background:none;font-family:inherit;cursor:pointer;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);position:relative}
.navbtn .ni{font-size:19px;line-height:1}
.navbtn .nl{font-size:9.5px;font-weight:700;letter-spacing:.02em}
.navbtn.active{color:var(--blue)}
.navbtn.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--orange)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,25,45,.5);z-index:60;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal.show{display:flex;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:slideup .26s cubic-bezier(.2,.7,.3,1);max-height:90vh;overflow-y:auto}
.sheet h3{font-family:'Fraunces',serif;font-weight:700;margin:0 0 4px;font-size:19px}
.sheet .sub{color:var(--ink-soft);font-size:13px;margin:0 0 16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--blue-300);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper-2);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.field textarea{resize:vertical;min-height:62px}
.typeseg{display:flex;gap:7px}
.typeseg button{flex:1;font-family:inherit;font-size:12px;font-weight:700;padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper-2);color:var(--ink-soft);cursor:pointer}
.typeseg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.reqstar{color:var(--orange)}
.modal-actions{display:flex;gap:9px;margin-top:6px}
.modal-actions .btn{flex:1;padding:13px}
.err{color:var(--orange);font-size:12px;font-weight:600;margin-top:-8px;margin-bottom:10px;display:none}
.err.show{display:block}

/* name picker */
.namelist{max-height:50vh;overflow-y:auto;margin-top:4px}
.nameitem{padding:12px 13px;border-radius:11px;cursor:pointer;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.nameitem:active{background:var(--paper)}
.nameitem .gr{margin-left:auto;font-size:11px;color:var(--gray);font-weight:600}
.nameitem .av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}

.empty-state{text-align:center;color:var(--ink-soft);padding:40px 20px;font-size:13.5px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--blue);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;opacity:0;transition:.3s;box-shadow:var(--shadow-lg);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brandrow">
      <div class="crest">N</div>
      <div class="brandtext">
        <h1>North Girls Cross Country</h1>
        <p>Naperville North · Huskies</p>
      </div>
    </div>
    <div class="idchip" id="idchip" style="display:none">
      <span class="ic">👤</span>
      <div class="who" id="whoText"></div>
      <button onclick="openNamePicker()">Switch</button>
    </div>
  </div>
</header>

<main class="wrap" id="page"></main>

<nav>
  <div class="navinner">
    <button class="navbtn active" data-tab="calendar" onclick="go('calendar')"><span class="ni">📅</span><span class="nl">Calendar</span></button>
    <button class="navbtn" data-tab="logbooks" onclick="go('logbooks')"><span class="ni">📓</span><span class="nl">Log Books</span></button>
    <button class="navbtn" data-tab="results" onclick="go('results')"><span class="ni">🏅</span><span class="nl">Results</span></button>
    <button class="navbtn" data-tab="links" onclick="go('links')"><span class="ni">🔗</span><span class="nl">Team</span></button>
    <button class="navbtn" data-tab="attendance" onclick="go('attendance')"><span class="ni">✋</span><span class="nl">Attendance</span></button>
  </div>
</nav>

<div class="dayview" id="dayview" style="display:none"></div>
<div class="modal" id="modal"><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"events": [{"date": "2025-08-18", "type": "practice", "title": "Afternoon Speed Session", "start": "3:25 PM", "end": "5:30 PM", "location": "NNHS Track", "maps": "", "theme": "", "updated": false, "schedule": ["3:25  Self-Therapy Prep Time", "3:35  Standard Warm-Up", "4:00  Run a Pacific Loop", "4:15  8x flying 30m (3.5 min easy jog rest)", "4:45  10 min cool down", "4:55  Blue Day Long", "5:25  Cool Yoga", "5:30  End Practice"], "notes": ["Eat a substantial snack within 2 hrs before and within 30 min after practice.", "USE the 10m accel/decel zones \u2014 easy to pull a muscle otherwise.", "Do NOT go under 3.5 min jog between reps."], "resources": ["Standard Warm-Up", "Self-Therapy Prep", "Strength Routines", "Blue Day Long", "Cool Yoga"], "image": ""}, {"date": "2025-08-26", "type": "practice", "title": "Morning Run", "start": "7:00 AM", "end": "8:15 AM", "location": "NNHS Track", "maps": "", "theme": "", "updated": false, "schedule": ["7:00  Standard Warm-Up", "7:15  Easy 4 miles", "8:00  Core & Cool"], "notes": ["Easy effort only."], "resources": ["Standard Warm-Up", "Strength Routines"], "image": ""}, {"date": "2025-08-26", "type": "practice", "title": "Afternoon Tempo", "start": "3:25 PM", "end": "5:30 PM", "location": "Blackwell Forest Preserve", "maps": "https://maps.google.com/?q=Blackwell+Forest+Preserve", "theme": "", "updated": true, "schedule": ["3:25  Self-Therapy Prep", "3:40  Standard Warm-Up", "4:00  Tempo intervals"], "notes": ["Note: away site \u2014 see maps button."], "resources": ["Standard Warm-Up", "Self-Therapy Prep", "Orange Day Short"], "image": ""}, {"date": "2025-09-13", "type": "meet", "title": "Conference Meet", "start": "", "end": "", "location": "Naperville Central HS", "maps": "https://maps.google.com/?q=Naperville+Central+High+School", "theme": "Class Color Day", "updated": false, "schedule": [], "notes": [], "resources": [], "meetName": "Conference Championship", "shakeout": "8:15 AM", "bus": "6:30 AM", "return": "2: ttps://www.athletic.net/REPLACE_ME"}, {"label": "Conference Meet", "date": "2025-09-13", "link": "https://www.athletic.net/REPLACE_ME"}], "teamlinks": [{"label": "Team Photos Folder", "link": "https://drive.google.com/REPLACE_ME", "desc": "Season photos \u2014 add your own too!"}, {"label": "Athletic.net", "link": "https://www.athletic.net/REPLACE_ME", "desc": "Our team page, results & rankings."}, {"label": "Team Instagram", "link": "https://instagram.com/REPLACE_ME", "desc": ""}], "roster": [{"name": "Maisie Anderson", "grade": "12"}, {"name": "Maya Brooks", "grade": "10"}, {"name": "Mai Tran", "grade": "9"}, {"name": "Ava Johnson", "grade": "11"}, {"name": "Sophia Martinez", "grade": "12"}, {"name": "Olivia Nguyen", "grade": "10"}, {"name": "Emma Patel", "grade": "9"}, {"name": "Grace Williams", "grade": "11"}]};
// in-memory stores (stand-ins for the Google Sheet via Apps Script)
let absences = [];   // {id, name, date, type, time, reason, status}
let completions = {};// key name||weekId -> bool
let me = null;       // current athlete name (would be remembered on device)
let viewYear, viewMonth; // calendar position
let openDayKey = null;

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const todayKey = '2025-08-26'; // demo "today" so example data is in view; real site uses actual today
const TYPE_CLASS = t => t==='practice'?'practice':t==='meet'?'meet':t==='team event'?'team':'other';

function init(){
  const d = parseKey(todayKey); viewYear=d.getFullYear(); viewMonth=d.getMonth();
  // demo: pretend we remembered a name? leave null so you see the picker flow
  renderID(); go('calendar');
}
function parseKey(k){const[y,m,dd]=k.split('-').map(Number);return new Date(y,m-1,dd);}
function key(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function fmtLong(k){const d=parseKey(k);return `${DOW[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;}
function eventsOn(k){return DATA.events.filter(e=>e.date===k).sort((a,b)=>(a.start||'').localeCompare(b.start||''));}
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('');}

function renderID(){
  const chip=document.getElementById('idchip');
  if(me){chip.style.display='flex';document.getElementById('whoText').innerHTML=`<span>Signed in as</span> ${me}`;}
  else chip.style.display='none';
}

/* ---------- NAV ---------- */
function go(tab){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const p=document.getElementById('page');
  if(tab==='calendar')p.innerHTML=calendarHTML();
  if(tab==='logbooks')p.innerHTML=logbooksHTML();
  if(tab==='results')p.innerHTML=resultsHTML();
  if(tab==='links')p.innerHTML=linksHTML();
  if(tab==='attendance')p.innerHTML=attendanceHTML();
  window.scrollTo(0,0);
}

/* ---------- CALENDAR ---------- */
function calendarHTML(){
  const first=new Date(viewYear,viewMonth,1), startDow=first.getDay();
  const days=new Date(viewYear,viewMonth+1,0).getDate();
  let cells='';
  for(let i=0;i<startDow;i++)cells+=`<div class="cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=key(viewYear,viewMonth,d), evs=eventsOn(k);
    const isToday=k===todayKey;
    const isPast=parseKey(k)<parseKey(todayKey)&&!isToday;
    const theme=evs.find(e=>e.theme);
    let pills=evs.slice(0,2).map(e=>`<div class="evpill ${TYPE_CLASS(e.type)}">${e.title}</div>`).join('');
    if(evs.length>2)pills+=`<div class="evpill other">+${evs.length-2}</div>`;
    cells+=`<div class="cell ${isToday?'today':''} ${isPast?'faded':''}" onclick="openDay('${k}')">
      <div class="num">${d}</div>
      ${theme?`<div class="themebadge">🎉</div>`:''}
      <div class="miniev">${pills}</div>
    </div>`;
  }
  return `
  <div class="calbar">
    <h2>${MONTHS[viewMonth]} ${viewYear}</h2>
    <div class="calnav">
      <button onclick="shiftMonth(-1)">‹</button>
      <button onclick="shiftMonth(1)">›</button>
    </div>
  </div>
  <div class="dow">${DOW.map(d=>`<div>${d}</div>`).join('')}</div>
  <div class="grid">${cells}</div>
  <div class="legend">
    <span><i style="background:var(--practice)"></i>Practice</span>
    <span><i style="background:var(--meet)"></i>Meet</span>
    <span><i style="background:var(--team)"></i>Team event</span>
    <span><i style="background:var(--other)"></i>Other</span>
  </div>
  <p style="text-align:center;color:var(--ink-soft);font-size:12px;margin-top:18px">Tap any day to see the full plan.</p>`;
}
function shiftMonth(n){viewMonth+=n;if(viewMonth<0){viewMonth=11;viewYear--}if(viewMonth>11){viewMonth=0;viewYear++}go('calendar');}

/* ---------- FULL-SCREEN DAY ---------- */
function openDay(k){
  openDayKey=k;
  const evs=eventsOn(k), dv=document.getElementById('dayview');
  const theme=(evs.find(e=>e.theme)||{}).theme;
  const isFuture=parseKey(k)>parseKey(todayKey);
  let body='';
  if(evs.length===0){
    body=`<div class="empty-state">No practice or events scheduled this day.<br>Rest up. 🌙</div>`;
  }
  evs.forEach(e=>{
    const tc=TYPE_CLASS(e.type);
    const tmline=[e.start,e.end].filter(Boolean).join(' – ');
    let meta='';
    if(e.location)meta+=`<div class="metarow"><span class="ic">📍</span><span>${e.location}</span>${e.maps?`<a class="mapbtn" href="${e.maps}" target="_blank">Maps</a>`:''}</div>`;
    if(tmline)meta+=`<div class="metarow"><span class="ic">🕒</span><span>${tmline}</span></div>`;
    let inner=meta;
    // practice content
    if(e.schedule&&e.schedule.length){
      inner+=`<div class="section-h">Schedule</div><ul class="sched">`+e.schedule.map(s=>{
        const m=s.match(/^(\S+)\s+(.*)$/);return m?`<li><span class="t">${m[1]}</span><span>${m[2]}</span></li>`:`<li><span>${s}</span></li>`;
      }).join('')+`</ul>`;
    }
    // meet content
    if(e.type==='meet'){
      let mr='';
      if(e.shakeout)mr+=`<div class="metarow"><span class="ic">👟</span><span>Shakeout run — ${e.shakeout}</span></div>`;
      if(e.bus)mr+=`<div class="metarow"><span class="ic">🚌</span><span>Bus departs — ${e.bus}</span></div>`;
      if(e.return)mr+=`<div class="metarow"><span class="ic">🏠</span><span>Return est. — ${e.return}</span></div>`;
      inner+=mr;
      if(e.raceSchedule&&e.raceSchedule.length)inner+=`<div class="section-h">Race Schedule</div><ul class="race">`+e.raceSchedule.map(r=>`<li>${r}</li>`).join('')+`</ul>`;
      if(e.courseMap)inner+=`<div style="margin-top:12px"><a class="resbtn" href="${e.courseMap}" target="_blank">🗺 Course Map</a></div>`;
    }
    if(e.notes&&e.notes.length){
      inner+=`<div class="section-h">Practice Notes</div><ul class="notes">`+e.notes.map(n=>`<li>${n}</li>`).join('')+`</ul>`;
    }
    if(e.image)inner+=`<img class="evimg" src="${e.image}" alt="" onerror="this.style.display='none'">`;
    if(e.resources&&e.resources.length){
      inner+=`<div class="section-h">Resources for today</div><div class="resbtns">`+e.resources.map(rn=>{
        const r=DATA.resources.find(x=>x.name===rn);return r?`<a class="resbtn" href="${r.link}" target="_blank">${r.name}</a>`:'';
      }).join('')+`</div>`;
    }
    body+=`<div class="evcard">
      <div class="evtop ${tc}">
        <span class="evtag ${tc}">${e.type}</span>
        <div class="evtitle"><h3>${e.title}${e.updated?'<span class="updated">UPDATED</span>':''}</h3>${tmline?`<div class="tm">${tmline}</div>`:''}</div>
      </div>
      <div class="evbody">${inner}</div>
    </div>`;
  });
  // attendance block
  body+=attendanceBlock(k);

  dv.innerHTML=`
    <div class="dvhead"><div class="wrap">
      <button class="dvback" onclick="closeDay()">‹</button>
      <div class="dvdate">
        <div class="d1">${isFuture?'Upcoming · subject to change':'Daily plan'}</div>
        <div class="d2">${fmtLong(k)}</div>
        ${theme?`<div class="dvtheme">🎉 ${theme}</div>`:''}
      </div>
    </div></div>
    <div class="wrap" style="padding-top:16px">${body}</div>`;
  dv.style.display='block';document.body.style.overflow='hidden';
}
function closeDay(){document.getElementById('dayview').style.display='none';document.body.style.overflow='';openDayKey=null;}

function attendanceBlock(k){
  if(!me){
    return `<div class="attnblock">
      <h4>Your attendance</h4>
      <p class="lead">Sign in with your name to mark if you'll miss this day or arrive late / leave early.</p>
      <button class="btn btn-o" onclick="openNamePicker()">Sign in</button>
    </div>`;
  }
  const mine=absences.find(a=>a.name===me&&a.date===k&&a.status==='active');
  let inner;
  if(mine){
    const label=mine.type==='absent'?'Absent':mine.type==='late'?'Arriving late':'Leaving early';
    const emo=mine.type==='absent'?'🚫':'⏱';
    inner=`<div class="attn-status absent">
        <span class="big">${emo}</span>
        <span class="txt">${label}${mine.time?` · ${mine.time}`:''}<small>${mine.reason}</small></span>
      </div>
      <div class="attn-actions">
        <button class="btn btn-ghost btn-sm" onclick="openAbsence('${k}','${mine.id}')">Edit</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelAbsence('${mine.id}')">Cancel this</button>
      </div>`;
  }else{
    inner=`<div class="attn-status">
        <span class="big">✓</span>
        <span class="txt">Expected at practice<small>No need to do anything if you'll be there</small></span>
      </div>
      <button class="btn btn-o" onclick="openAbsence('${k}',null)">Can't make it / late / leaving early</button>`;
  }
  return `<div class="attnblock"><h4>Your attendance</h4><p class="lead">${fmtLong(k)}</p>${inner}</div>`;
}

/* ---------- ABSENCE MODAL ---------- */
let absDraft={type:'absent'};
function openAbsence(dateKey,editId){
  if(!me){openNamePicker();return;}
  let existing=editId?absences.find(a=>a.id===editId):null;
  absDraft={type:existing?existing.type:'absent',time:existing?existing.time:'',reason:existing?existing.reason:'',date:dateKey,editId};
  renderAbsenceSheet();showModal();
}
function setAbsType(t){absDraft.type=t;renderAbsenceSheet();}
function renderAbsenceSheet(){
  const needTime=absDraft.type!=='absent';
  document.getElementById('sheetBody').innerHTML=`
    <h3>${absDraft.editId?'Edit':'Mark'} attendance</h3>
    <p class="sub">${fmtLong(absDraft.date)} · ${me}</p>
    <div class="field"><label>What's happening?</label>
      <div class="typeseg">
        <button class="${absDraft.type==='absent'?'on':''}" onclick="setAbsType('absent')">Absent</button>
        <button class="${absDraft.type==='late'?'on':''}" onclick="setAbsType('late')">Late</button>
        <button class="${absDraft.type==='early'?'on':''}" onclick="setAbsType('early')">Leave early</button>
      </div>
    </div>
    ${needTime?`<div class="field"><label>${absDraft.type==='late'?'Arriving around':'Leaving at'}</label>
      <input id="absTime" type="text" placeholder="e.g. 4:45 PM" value="${absDraft.time||''}"></div>`:''}
    <div class="field"><label>Reason <span class="reqstar">*required</span></label>
      <textarea id="absReason" placeholder="e.g. Dentist appointment (afternoon practice)">${absDraft.reason||''}</textarea>
    </div>
    <div class="err" id="absErr">Please add a reason.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-o" onclick="saveAbsence()">${absDraft.editId?'Save changes':'Submit'}</button>
    </div>`;
}
function saveAbsence(){
  const reason=(document.getElementById('absReason').value||'').trim();
  const time=document.getElementById('absTime')?document.getElementById('absTime').value.trim():'';
  if(!reason){document.getElementById('absErr').classList.add('show');return;}
  if(absDraft.editId){
    const a=absences.find(x=>x.id===absDraft.editId);
    a.type=absDraft.type;a.time=time;a.reason=reason;
    toast('Updated ✓');
  }else{
    absences.push({id:'a'+Date.now(),name:me,date:absDraft.date,type:absDraft.type,time,reason,status:'active'});
    toast('Submitted ✓');
  }
  closeModal();
  if(openDayKey)openDay(openDayKey);
  if(document.querySelector('.navbtn.active').dataset.tab==='attendance')go('attendance');
}
function cancelAbsence(id){
  const a=absences.find(x=>x.id===id);if(a)a.status='cancelled';
  toast('Absence cancelled');
  if(openDayKey)openDay(openDayKey);
  if(document.querySelector('.navbtn.active').dataset.tab==='attendance')go('attendance');
}

/* ---------- NAME PICKER ---------- */
function openNamePicker(){
  document.getElementById('sheetBody').innerHTML=`
    <h3>Who are you?</h3>
    <p class="sub">Start typing your name. We'll remember you on this device.</p>
    <div class="field"><input id="nameSearch" type="text" placeholder="Type your name…" oninput="filterNames()" autocomplete="off"></div>
    <div class="namelist" id="nameList"></div>`;
  showModal();filterNames();
  setTimeout(()=>{const n=document.getElementById('nameSearch');if(n)n.focus();},250);
}
function filterNames(){
  const q=(document.getElementById('nameSearch').value||'').toLowerCase();
  const list=DATA.roster.filter(r=>r.name.toLowerCase().includes(q)).slice(0,30);
  document.getElementById('nameList').innerHTML=list.length?list.map(r=>
    `<div class="nameitem" onclick="pickName('${r.name.replace(/'/g,"\\'")}')">
      <span class="av">${initials(r.name)}</span>${r.name}<span class="gr">Gr ${r.grade}</span></div>`
  ).join(''):`<div class="empty-state">No match. Check spelling or ask your coach to add you.</div>`;
}
function pickName(n){me=n;renderID();closeModal();toast(`Welcome, ${n.split(' ')[0]} 👋`);
  if(openDayKey)openDay(openDayKey);
  const tab=document.querySelector('.navbtn.active').dataset.tab;go(tab);
}

/* ---------- LOG BOOKS ---------- */
function logbooksHTML(){
  const now=parseKey(todayKey);
  const rows=[...DATA.logbooks].reverse().map(lb=>{
    const due=parseKey(lb.due);const past=due<now;
    const done=me&&completions[me+'||'+lb.id];
    return `<div class="lbcard">
      <div class="lbinfo">
        <h3>${lb.label}</h3>
        <div class="due ${past?'past':''}">${past?'Past due':'Due'} ${MONTHS[due.getMonth()].slice(0,3)} ${due.getDate()} · ${lb.dueTime}</div>
      </div>
      <div class="lbactions">
        <a class="openbtn" href="${lb.link}" target="_blank">Open</a>
        <button class="checkbtn ${done?'done':''}" onclick="toggleDone('${lb.id}')">${done?'✓ Marked done':'Mark complete'}</button>
      </div>
    </div>`;
  }).join('');
  return `<h1 class="pagetitle">Log Books</h1>
    <p class="pagesub">Every week's log book. Catch up on any you missed.</p>
    ${me?'':'<p class="pagesub" style="color:var(--orange)">Sign in (tap Attendance) to mark weeks complete.</p>'}
    ${rows}`;
}
function toggleDone(weekId){
  if(!me){openNamePicker();return;}
  const k=me+'||'+weekId;completions[k]=!completions[k];
  toast(completions[k]?'Marked complete ✓':'Unmarked');go('logbooks');
}

/* ---------- RESULTS ---------- */
function resultsHTML(){
  const rows=DATA.results.map(r=>`
    <a class="bare" href="${r.link}" target="_blank"><div class="linkcard">
      <div class="lk orange">🏅</div>
      <div class="lkinfo"><h3>${r.label}</h3>${r.date?`<p>${fmtLong(r.date)}</p>`:'<p>Full season</p>'}</div>
      <span class="arrow">↗</span>
    </div></a>`).join('');

}

  return `<h1 class="pagetitle">Team</h1><p class="pagesub">Photos, athletic.net, socials & more.</p>${rows}`;

/* ---------- MY ATTENDANCE ---------- */
function attendanceHTML(){
  if(!me){
    return `<h1 class="pagetitle">My Attendance</h1>
      <p class="pagesub">Mark absences, late arrivals, or early departures — even days ahead.</p>
      <div class="empty-state" style="background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)">
        <div style="font-size:34px;margin-bottom:8px">✋</div>
        Sign in with your name to manage your attendance.<br><br>
        <button class="btn btn-o" onclick="openNamePicker()">Sign in</button>
      </div>`;
  }
  const mine=absences.filter(a=>a.name===me).sort((a,b)=>a.date.localeCompare(b.date));
  const active=mine.filter(a=>a.status==='active');
  let list;
  if(mine.length===0){
    list=`<div class="empty-state" style="background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)">
      <div style="font-size:30px;margin-bottom:6px">👍</div>
      You haven't logged any absences.<br>You're expected at every practice.</div>`;
  }else{
    list=mine.map(a=>{
      const cls=a.type==='absent'?'absent':a.type==='late'?'late':'early';
      const lbl=a.type==='absent'?'Absent':a.type==='late'?'Late':'Leave early';
      return `<div class="myabs ${a.status==='cancelled'?'cancelled':''}">
        <span class="tag ${cls}">${lbl}</span>
        <div class="info"><div class="dt">${fmtLong(a.date)}${a.time?` · ${a.time}`:''}</div>
          <div class="rs">${a.reason}${a.status==='cancelled'?' · (cancelled)':''}</div></div>
        ${a.status==='active'?`<button class="btn btn-ghost btn-sm" onclick="openAbsence('${a.date}','${a.id}')">Edit</button>`:''}
      </div>`;
    }).join('');
  }
  return `<h1 class="pagetitle">My Attendance</h1>
    <p class="pagesub">${active.length?active.length+' upcoming note'+(active.length>1?'s':''):'All clear'} · ${me}</p>
    <button class="btn btn-o" style="width:100%;padding:13px;margin-bottom:16px" onclick="quickAdd()">+ Add an absence / late / early</button>
    ${list}`;
}
function quickAdd(){openAbsence(todayKey,null);}

/* ---------- helpers ---------- */
function showModal(){document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

init();
