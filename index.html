<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Naperville North Girls Cross Country</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a2a4e;  --navy-deep:#072037; --navy-mid:#10395f;
  --orange:#FF4800; --orange-2:#ff6326;
  --gray:#ACA89F; --line:rgba(255,255,255,.12); --line-solid:#15466f;
  --ink:#eaf1f8; --ink-soft:#9fb6cd; --ink-dim:#6f8aa6;
  --card:#103a5f; --card-2:#0d3253; --card-hi:#16456e;
  --practice:#2f7fc4; --meet:#FF4800; --team:#23a06a; --other:#7d8aa0;
  --r:14px; --shadow:0 2px 8px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Montserrat',system-ui,sans-serif;
  background:#0a2a4e;
  color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
}
body{background:linear-gradient(180deg,#0b2c52 0%,#08233f 60%,#07203a 100%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;width:100%}

/* ===== SIGN-IN GATE ===== */
#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#0b2c52,#07203a);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;text-align:center}
#gate .logo{width:120px;height:120px;border-radius:50%;box-shadow:0 8px 30px rgba(0,0,0,.4);margin-bottom:22px}
#gate h1{font-weight:800;font-size:24px;line-height:1.15;margin:0 0 6px;letter-spacing:-.2px}
#gate h1 .o{color:var(--orange)}
#gate .sub{color:var(--ink-soft);font-size:13.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin:0 0 30px}
#gate .gatecard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;width:100%;max-width:380px;box-shadow:var(--shadow)}
#gate label{display:block;text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
#gate input{width:100%;font-family:inherit;font-size:16px;font-weight:500;padding:13px 15px;border:1.5px solid var(--line-solid);border-radius:12px;background:#0c2f51;color:#fff}
#gate input:focus{outline:none;border-color:var(--orange)}
#gate input::placeholder{color:var(--ink-dim)}
.gatelist{margin-top:10px;max-height:46vh;overflow-y:auto;text-align:left}
.gateitem{padding:13px 14px;border-radius:12px;cursor:pointer;font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:11px;color:#fff}
.gateitem:active,.gateitem:hover{background:var(--card-hi)}
.gateitem .av{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.gateitem .gr{margin-left:auto;font-size:11.5px;color:var(--ink-dim);font-weight:600}
.gatehint{color:var(--ink-dim);font-size:12px;margin-top:14px}
#gate .empty{color:var(--ink-dim);font-size:13px;padding:20px;text-align:center}

/* ===== HEADER (DVC style) ===== */
header{background:var(--navy-deep);border-bottom:3px solid var(--orange)}
.hdr{display:flex;align-items:center;gap:14px;padding:13px 0}
.hdr .logo{width:50px;height:50px;border-radius:50%;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.hdr .htxt h1{font-weight:800;font-size:17px;line-height:1.12;margin:0;letter-spacing:-.2px}
.hdr .htxt p{margin:2px 0 0;font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
.hdr .who{margin-left:auto;text-align:right;flex:none}
.hdr .who .nm{font-size:12.5px;font-weight:700;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .who button{margin-top:3px;background:none;border:none;color:var(--orange);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:0}

/* ===== TOP TABS ===== */
.tabs{background:var(--navy-deep);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line-solid)}
.tabsinner{max-width:560px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.tabsinner::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:none;background:none;font-family:inherit;cursor:pointer;padding:13px 16px 11px;color:var(--ink-soft);font-size:13px;font-weight:700;letter-spacing:.01em;white-space:nowrap;position:relative;transition:color .15s}
.tab.active{color:#fff}
.tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--orange)}

main{padding-top:18px;padding-bottom:40px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pagetitle{font-weight:800;font-size:22px;margin:0 0 3px;letter-spacing:-.3px}
.pagesub{color:var(--ink-soft);font-size:13px;margin:0 0 16px;font-weight:500}

/* ===== CALENDAR ===== */
.calbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calbar h2{font-weight:800;font-size:19px;margin:0}
.calnav{display:flex;gap:8px}
.calnav button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line-solid);background:var(--card);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
.calnav button:active{background:var(--card-hi)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow div{text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{min-height:74px;border-radius:11px;background:var(--card);border:1px solid var(--line-solid);padding:5px 4px 4px;cursor:pointer;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:transform .07s}
.cell.empty{background:transparent;border-color:transparent;cursor:default}
.cell.today{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.cell:not(.empty):active{transform:scale(.96)}
.cell .num{font-size:12px;font-weight:700;color:var(--ink);text-align:center;line-height:1.3}
.cell.today .num{color:var(--orange)}
.cell.faded{opacity:.5}
.themedot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:#ffd23f;box-shadow:0 0 0 1.5px var(--card)}
.miniev{margin-top:3px;display:flex;flex-direction:column;gap:2px}
.evpill{font-size:8px;line-height:1.25;padding:2px 3px;border-radius:4px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}
.evpill.practice{background:var(--practice)}.evpill.meet{background:var(--meet)}.evpill.team{background:var(--team)}.evpill.other{background:var(--other)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:16px 2px 0;font-size:12px;color:var(--ink-soft);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ===== DAY VIEW (full screen) ===== */
.dayview{position:fixed;inset:0;background:linear-gradient(180deg,#0b2c52,#08233f);z-index:50;overflow-y:auto;display:none;animation:slideup .26s cubic-bezier(.2,.7,.3,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.dvhead{background:var(--navy-deep);border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:2}
.dvhead .row{display:flex;align-items:flex-start;gap:12px;padding:14px 0}
.dvback{background:var(--card);border:1px solid var(--line-solid);color:#fff;width:40px;height:40px;border-radius:11px;font-size:19px;cursor:pointer;flex:none}
.dvback:active{transform:scale(.94)}
.dvdate .d1{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.dvdate .d2{font-weight:800;font-size:21px;margin-top:1px;letter-spacing:-.3px}
.dvtheme{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:var(--orange);color:#fff;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px}
.evcard{background:var(--card);border:1px solid var(--line-solid);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.evtop{padding:13px 15px;border-left:5px solid var(--practice);display:flex;align-items:center;gap:10px}
.evtop.practice{border-color:var(--practice)}.evtop.meet{border-color:var(--meet)}.evtop.team{border-color:var(--team)}.evtop.other{border-color:var(--other)}
.evtag{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;flex:none}
.evtag.practice{background:var(--practice)}.evtag.meet{background:var(--meet)}.evtag.team{background:var(--team)}.evtag.other{background:var(--other)}
.evtitle{flex:1}
.evtitle h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.2px}
.evtitle .tm{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-weight:600}
.updated{display:inline-block;margin-left:7px;font-size:9px;font-weight:800;color:#fff;background:var(--orange);border-radius:5px;padding:2px 6px;vertical-align:middle;letter-spacing:.04em}
.evbody{padding:0 15px 14px}
.metarow{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 0;border-top:1px solid var(--line-solid)}
.metarow .ic{color:var(--orange);font-size:13px;width:16px;text-align:center;flex:none;font-weight:700}
.mapbtn{margin-left:auto;background:var(--orange);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:5px 11px;border-radius:8px}
.section-h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 8px}
.sched{list-style:none;padding:0;margin:0}
.sched li{display:flex;gap:11px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line-solid)}
.sched li:last-child{border-bottom:none}
.sched .t{font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums;flex:none;min-width:54px}
.notes{margin:0;padding-left:18px}
.notes li{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;line-height:1.5;font-weight:500}
.evimg{width:100%;border-radius:11px;margin-top:12px;border:1px solid var(--line-solid)}
.resbtns{display:flex;flex-wrap:wrap;gap:8px}
.resbtn{display:block;background:var(--card-hi);border:1.5px solid var(--orange);color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:10px}
.resbtn:active{background:var(--orange)}

.attnblock{background:var(--card-2);border:1.5px dashed var(--line-solid);border-radius:var(--r);padding:14px 15px;margin-bottom:30px}
.attnblock h4{margin:0 0 4px;font-size:14px;font-weight:800}
.attnblock .lead{font-size:12.5px;color:var(--ink-soft);margin:0 0 11px;font-weight:500}
.attn-status{display:flex;align-items:center;gap:10px;background:rgba(35,160,106,.16);border:1px solid rgba(35,160,106,.4);border-radius:11px;padding:11px 13px;margin-bottom:10px}
.attn-status.absent{background:rgba(255,72,0,.14);border-color:rgba(255,72,0,.45)}
.attn-status .big{font-size:17px;font-weight:800}
.attn-status .txt{font-size:13px;font-weight:700;flex:1}
.attn-status .txt small{display:block;font-weight:500;color:var(--ink-soft);font-size:11.5px;margin-top:2px}
.attn-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{font-family:inherit;border:none;cursor:pointer;font-weight:700;border-radius:10px;font-size:12.5px;padding:10px 14px}
.btn-o{background:var(--orange);color:#fff}.btn-o:active{background:var(--orange-2)}
.btn-ghost{background:var(--card-hi);border:1.5px solid var(--line-solid);color:#fff}
.btn-sm{padding:7px 11px;font-size:11.5px}

.lbcard,.linkcard{background:var(--card);border:1px solid var(--line-solid);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:12px}
.lbcard{display:flex;align-items:center;gap:12px}
.lbcard .lbinfo{flex:1}
.lbcard h3{margin:0;font-size:15px;font-weight:700}
.lbcard .due{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:600}
.lbcard .due.past{color:var(--orange)}
.lbcard .lbactions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.openbtn{background:var(--orange);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;border-radius:9px;white-space:nowrap}
.checkbtn{background:var(--card-hi);border:1.5px solid var(--line-solid);color:var(--ink-soft);font-family:inherit;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.checkbtn.done{background:rgba(35,160,106,.2);border-color:var(--team);color:#5fd99e}
.linkcard{display:flex;align-items:center;gap:13px}
.linkcard .lkinfo{flex:1}
.linkcard h3{margin:0;font-size:14.5px;font-weight:700}
.linkcard p{margin:2px 0 0;font-size:12px;color:var(--ink-soft);font-weight:500}
.linkcard .arrow{color:var(--orange);font-size:17px;font-weight:800}
a.bare{text-decoration:none;color:inherit}

.myabs{background:var(--card);border:1px solid var(--line-solid);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px;margin-bottom:11px;display:flex;align-items:center;gap:11px}
.myabs .tag{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:3px 8px;border-radius:6px;flex:none}
.tag.absent{background:var(--orange)}.tag.late{background:#c79100}.tag.early{background:#8a6bd6}
.myabs .info{flex:1}
.myabs .info .dt{font-size:13.5px;font-weight:700}
.myabs .info .rs{font-size:12px;color:var(--ink-soft);margin-top:1px;font-weight:500}
.myabs.cancelled{opacity:.5}
.myabs.cancelled .info .dt{text-decoration:line-through}

.modal{position:fixed;inset:0;background:rgba(4,15,28,.66);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex;animation:fade .2s}
.sheet{background:#0d3253;border-top:3px solid var(--orange);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:slideup .24s cubic-bezier(.2,.7,.3,1);max-height:90vh;overflow-y:auto}
.sheet h3{font-weight:800;margin:0 0 4px;font-size:18px}
.sheet .sub2{color:var(--ink-soft);font-size:13px;margin:0 0 16px;font-weight:500}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:7px}
.field input,.field textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:1.5px solid var(--line-solid);border-radius:11px;background:#0c2f51;color:#fff}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--orange)}
.field textarea{resize:vertical;min-height:62px}
.typeseg{display:flex;gap:7px}
.typeseg button{flex:1;font-family:inherit;font-size:12px;font-weight:700;padding:11px 4px;border-radius:10px;border:1.5px solid var(--line-solid);background:#0c2f51;color:var(--ink-soft);cursor:pointer}
.typeseg button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.reqstar{color:var(--orange)}
.modal-actions{display:flex;gap:9px;margin-top:4px}
.modal-actions .btn{flex:1;padding:13px}
.err{color:var(--orange);font-size:12px;font-weight:700;margin:-6px 0 10px;display:none}
.err.show{display:block}
.empty-state{text-align:center;color:var(--ink-soft);padding:38px 20px;font-size:13.5px;font-weight:500;background:var(--card);border:1px solid var(--line-solid);border-radius:var(--r)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--orange);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:700;z-index:80;opacity:0;transition:.3s;box-shadow:0 8px 30px rgba(0,0,0,.4);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- SIGN IN GATE -->
<div id="gate">
  <img class="logo" id="gateLogo" alt="Huskies">
  <h1>Naperville North<br><span class="o">Girls Cross Country</span></h1>
  <p class="sub">Huskies · DuPage Valley Conference</p>
  <div class="gatecard">
    <label>Find your name to sign in</label>
    <input id="gateSearch" type="text" placeholder="Start typing your name…" oninput="gateFilter()" autocomplete="off">
    <div class="gatelist" id="gateList"></div>
  </div>
  <p class="gatehint">We'll remember you on this device.</p>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header><div class="wrap hdr">
    <img class="logo" id="hdrLogo" alt="">
    <div class="htxt">
      <h1>Naperville North Girls Cross Country</h1>
      <p>DuPage Valley Conference</p>
    </div>
    <div class="who"><div class="nm" id="whoName"></div><button onclick="signOut()">Switch</button></div>
  </div></header>

  <div class="tabs"><div class="tabsinner" id="tabsInner">
    <button class="tab active" data-tab="calendar" onclick="go('calendar')">Calendar</button>
    <button class="tab" data-tab="logbooks" onclick="go('logbooks')">Log Books</button>
    <button class="tab" data-tab="results" onclick="go('results')">Results</button>
    <button class="tab" data-tab="links" onclick="go('links')">Team</button>
    <button class="tab" data-tab="attendance" onclick="go('attendance')">My Attendance</button>
  </div></div>

  <main class="wrap" id="page"></main>
</div>

<div class="dayview" id="dayview"></div>
<div class="modal" id="modal"><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

let absences=[], completions={}, me=null;
let viewYear=2026, viewMonth=5; // June 2026 (0-indexed)
let openDayKey=null;

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const todayKey='2026-06-17'; // demo "today" within the season; real site uses actual date
const TC=t=>t==='practice'?'practice':t==='meet'?'meet':t==='team event'?'team':'other';

function parseKey(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function key(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function fmtLong(k){const d=parseKey(k);return `${DOW_FULL[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;}
function eventsOn(k){return DATA.events.filter(e=>e.date===k).sort((a,b)=>(a.start||'').localeCompare(b.start||''));}
function initials(n){const p=n.trim().split(/\s+/);return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}

/* ===== GATE ===== */
document.getElementById('gateLogo').src=LOGO;
document.getElementById('hdrLogo').src=LOGO;
function gateFilter(){
  const q=(document.getElementById('gateSearch').value||'').toLowerCase().trim();
  const el=document.getElementById('gateList');
  if(!q){el.innerHTML='';return;}
  const list=DATA.roster.filter(r=>r.name.toLowerCase().includes(q)).slice(0,40);
  el.innerHTML=list.length?list.map(r=>
    `<div class="gateitem" onclick="signIn('${r.name.replace(/'/g,"\\'")}')">
      <span class="av">${initials(r.name)}</span>${r.name}${r.grade?`<span class="gr">Gr ${r.grade}</span>`:''}</div>`
  ).join(''):`<div class="empty">No match — check spelling or ask your coach.</div>`;
}
function signIn(n){me=n;document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';
  document.getElementById('whoName').textContent=n;go('calendar');toast(`Welcome, ${n.split(' ')[0]}`);}
function signOut(){me=null;document.getElementById('app').style.display='none';const g=document.getElementById('gate');g.style.display='flex';
  document.getElementById('gateSearch').value='';document.getElementById('gateList').innerHTML='';}

/* ===== NAV ===== */
function go(tab){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const p=document.getElementById('page');
  p.innerHTML={calendar:calendarHTML,logbooks:logbooksHTML,results:resultsHTML,links:linksHTML,attendance:attendanceHTML}[tab]();
  window.scrollTo(0,0);
}

/* ===== CALENDAR ===== */
function calendarHTML(){
  const first=new Date(viewYear,viewMonth,1),startDow=first.getDay();
  const days=new Date(viewYear,viewMonth+1,0).getDate();
  let cells='';
  for(let i=0;i<startDow;i++)cells+=`<div class="cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=key(viewYear,viewMonth,d),evs=eventsOn(k);
    const isToday=k===todayKey, isPast=parseKey(k)<parseKey(todayKey)&&!isToday;
    const theme=evs.find(e=>e.theme);
    let pills=evs.slice(0,2).map(e=>`<div class="evpill ${TC(e.type)}">${e.title}</div>`).join('');
    if(evs.length>2)pills+=`<div class="evpill other">+${evs.length-2} more</div>`;
    cells+=`<div class="cell ${isToday?'today':''} ${isPast?'faded':''}" onclick="openDay('${k}')">
      <div class="num">${d}</div>${theme?'<div class="themedot"></div>':''}
      <div class="miniev">${pills}</div></div>`;
  }
  return `<div class="calbar"><h2>${MONTHS[viewMonth]} ${viewYear}</h2>
    <div class="calnav"><button onclick="shiftMonth(-1)">‹</button><button onclick="shiftMonth(1)">›</button></div></div>
    <div class="dow">${DOW_FULL.map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="grid">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--practice)"></i>Practice</span>
      <span><i style="background:var(--meet)"></i>Meet</span>
      <span><i style="background:var(--team)"></i>Team event</span>
      <span><i style="background:var(--other)"></i>Other</span>
    </div>
    <p style="text-align:center;color:var(--ink-soft);font-size:12px;margin-top:18px;font-weight:500">Tap any day to see the full plan.</p>`;
}
function shiftMonth(n){viewMonth+=n;if(viewMonth<0){viewMonth=11;viewYear--}if(viewMonth>11){viewMonth=0;viewYear++}go('calendar');}

/* ===== DAY VIEW ===== */
function openDay(k){
  openDayKey=k;
  const evs=eventsOn(k),dv=document.getElementById('dayview');
  const theme=(evs.find(e=>e.theme)||{}).theme;
  const isFuture=parseKey(k)>parseKey(todayKey);
  let body='';
  if(!evs.length)body=`<div class="empty-state">No practice or events scheduled.<br>Rest up.</div>`;
  evs.forEach(e=>{
    const tc=TC(e.type),tmline=[e.start,e.end].filter(Boolean).join(' – ');
    let m='';
    if(e.location)m+=`<div class="metarow"><span class="ic">▸</span><span>${e.location}</span>${e.maps?`<a class="mapbtn" href="${e.maps}" target="_blank">Maps</a>`:''}</div>`;
    if(tmline)m+=`<div class="metarow"><span class="ic">◷</span><span>${tmline}</span></div>`;
    let inner=m;
    if(e.schedule&&e.schedule.length){inner+=`<div class="section-h">Schedule</div><ul class="sched">`+e.schedule.map(s=>{const x=s.match(/^(\S+)\s+(.*)$/);return x?`<li><span class="t">${x[1]}</span><span>${x[2]}</span></li>`:`<li><span>${s}</span></li>`;}).join('')+`</ul>`;}
    if(e.type==='meet'){
      let mr='';
      if(e.shakeout)mr+=`<div class="metarow"><span class="ic">▸</span><span>Shakeout run — ${e.shakeout}</span></div>`;
      if(e.bus)mr+=`<div class="metarow"><span class="ic">▸</span><span>Bus departs — ${e.bus}</span></div>`;
      if(e.return)mr+=`<div class="metarow"><span class="ic">▸</span><span>Return est. — ${e.return}</span></div>`;
      inner+=mr;
      if(e.raceSchedule&&e.raceSchedule.length)inner+=`<div class="section-h">Race Schedule</div><ul class="sched">`+e.raceSchedule.map(r=>`<li><span>${r}</span></li>`).join('')+`</ul>`;
      if(e.courseMap)inner+=`<div style="margin-top:12px"><a class="resbtn" href="${e.courseMap}" target="_blank">Course Map</a></div>`;
    }
    if(e.notes&&e.notes.length)inner+=`<div class="section-h">Notes</div><ul class="notes">`+e.notes.map(n=>`<li>${n}</li>`).join('')+`</ul>`;
    if(e.image)inner+=`<img class="evimg" src="${e.image}" onerror="this.style.display='none'">`;
    if(e.resources&&e.resources.length)inner+=`<div class="section-h">Resources for today</div><div class="resbtns">`+e.resources.map(rn=>{const r=DATA.resources.find(x=>x.name===rn);return r?`<a class="resbtn" href="${r.link}" target="_blank">${r.name}</a>`:'';}).join('')+`</div>`;
    body+=`<div class="evcard"><div class="evtop ${tc}"><span class="evtag ${tc}">${e.type}</span>
      <div class="evtitle"><h3>${e.title}${e.updated?'<span class="updated">UPDATED</span>':''}</h3>${tmline?`<div class="tm">${tmline}</div>`:''}</div></div>
      <div class="evbody">${inner}</div></div>`;
  });
  body+=attendanceBlock(k);
  dv.innerHTML=`<div class="dvhead"><div class="wrap row">
      <button class="dvback" onclick="closeDay()">‹</button>
      <div class="dvdate"><div class="d1">${isFuture?'Upcoming · subject to change':'Daily plan'}</div>
        <div class="d2">${fmtLong(k)}</div>${theme?`<div class="dvtheme">★ ${theme}</div>`:''}</div>
    </div></div><div class="wrap" style="padding-top:16px">${body}</div>`;
  dv.style.display='block';document.body.style.overflow='hidden';
}
function closeDay(){document.getElementById('dayview').style.display='none';document.body.style.overflow='';openDayKey=null;}

function attendanceBlock(k){
  const mine=absences.find(a=>a.name===me&&a.date===k&&a.status==='active');
  let inner;
  if(mine){
    const label=mine.type==='absent'?'Absent':mine.type==='late'?'Arriving late':'Leaving early';
    inner=`<div class="attn-status absent"><span class="big">!</span>
        <span class="txt">${label}${mine.time?` · ${mine.time}`:''}<small>${mine.reason}</small></span></div>
      <div class="attn-actions"><button class="btn btn-ghost btn-sm" onclick="openAbsence('${k}','${mine.id}')">Edit</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelAbsence('${mine.id}')">Cancel this</button></div>`;
  }else{
    inner=`<div class="attn-status"><span class="big">✓</span>
        <span class="txt">Expected at practice<small>Nothing to do if you'll be there</small></span></div>
      <button class="btn btn-o" onclick="openAbsence('${k}',null)">Can't make it / late / leaving early</button>`;
  }
  return `<div class="attnblock"><h4>Your attendance</h4><p class="lead">${fmtLong(k)}</p>${inner}</div>`;
}

/* ===== ABSENCE MODAL ===== */
let absDraft={};
function openAbsence(dateKey,editId){
  const ex=editId?absences.find(a=>a.id===editId):null;
  absDraft={type:ex?ex.type:'absent',time:ex?ex.time:'',reason:ex?ex.reason:'',date:dateKey,editId};
  renderAbsence();showModal();
}
function setAbsType(t){absDraft.type=t;
  absDraft.reason=document.getElementById('absReason')?document.getElementById('absReason').value:absDraft.reason;
  absDraft.time=document.getElementById('absTime')?document.getElementById('absTime').value:absDraft.time;
  renderAbsence();}
function renderAbsence(){
  const need=absDraft.type!=='absent';
  document.getElementById('sheetBody').innerHTML=`
    <h3>${absDraft.editId?'Edit':'Mark'} attendance</h3>
    <p class="sub2">${fmtLong(absDraft.date)} · ${me}</p>
    <div class="field"><label>What's happening?</label><div class="typeseg">
      <button class="${absDraft.type==='absent'?'on':''}" onclick="setAbsType('absent')">Absent</button>
      <button class="${absDraft.type==='late'?'on':''}" onclick="setAbsType('late')">Late</button>
      <button class="${absDraft.type==='early'?'on':''}" onclick="setAbsType('early')">Leave early</button></div></div>
    ${need?`<div class="field"><label>${absDraft.type==='late'?'Arriving around':'Leaving at'}</label>
      <input id="absTime" type="text" placeholder="e.g. 4:45 PM" value="${absDraft.time||''}"></div>`:''}
    <div class="field"><label>Reason <span class="reqstar">*required</span></label>
      <textarea id="absReason" placeholder="e.g. Dentist appointment (afternoon practice)">${absDraft.reason||''}</textarea></div>
    <div class="err" id="absErr">Please add a reason.</div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-o" onclick="saveAbsence()">${absDraft.editId?'Save changes':'Submit'}</button></div>`;
}
function saveAbsence(){
  const reason=(document.getElementById('absReason').value||'').trim();
  const time=document.getElementById('absTime')?document.getElementById('absTime').value.trim():'';
  if(!reason){document.getElementById('absErr').classList.add('show');return;}
  if(absDraft.editId){const a=absences.find(x=>x.id===absDraft.editId);a.type=absDraft.type;a.time=time;a.reason=reason;toast('Updated');}
  else{absences.push({id:'a'+Date.now(),name:me,date:absDraft.date,type:absDraft.type,time,reason,status:'active'});toast('Submitted');}
  closeModal();if(openDayKey)openDay(openDayKey);
  if(document.querySelector('.tab.active').dataset.tab==='attendance')go('attendance');
}
function cancelAbsence(id){const a=absences.find(x=>x.id===id);if(a)a.status='cancelled';toast('Cancelled');
  if(openDayKey)openDay(openDayKey);if(document.querySelector('.tab.active').dataset.tab==='attendance')go('attendance');}

/* ===== LOG BOOKS ===== */
function logbooksHTML(){
  const now=parseKey(todayKey);
  const rows=[...DATA.logbooks].reverse().map(lb=>{
    const due=parseKey(lb.due),past=due<now,done=completions[me+'||'+lb.id];
    return `<div class="lbcard"><div class="lbinfo"><h3>${lb.label}</h3>
      <div class="due ${past?'past':''}">${past?'Past due':'Due'} ${MONTHS[due.getMonth()].slice(0,3)} ${due.getDate()} · ${lb.dueTime}</div></div>
      <div class="lbactions"><a class="openbtn" href="${lb.link}" target="_blank">Open</a>
        <button class="checkbtn ${done?'done':''}" onclick="toggleDone('${lb.id}')">${done?'✓ Done':'Mark complete'}</button></div></div>`;
  }).join('');
  return `<h1 class="pagetitle">Log Books</h1><p class="pagesub">Every week's log book — catch up on any you missed.</p>${rows}`;
}
function toggleDone(id){const k=me+'||'+id;completions[k]=!completions[k];toast(completions[k]?'Marked complete':'Unmarked');go('logbooks');}

/* ===== RESULTS ===== */
function resultsHTML(){
  const rows=DATA.results.map(r=>`<a class="bare" href="${r.link}" target="_blank"><div class="linkcard">
    <div class="lkinfo"><h3>${r.label}</h3><p>${r.date?fmtLong(r.date):'Full season results & rankings'}</p></div>
    <span class="arrow">↗</span></div></a>`).join('');
  return `<h1 class="pagetitle">Results</h1><p class="pagesub">Meet results & rankings.</p>${rows}`;
}

/* ===== TEAM LINKS ===== */
function linksHTML(){
  const rows=DATA.teamlinks.map(l=>`<a class="bare" href="${l.link}" target="_blank"><div class="linkcard">
    <div class="lkinfo"><h3>${l.label}</h3>${l.desc?`<p>${l.desc}</p>`:''}</div><span class="arrow">↗</span></div></a>`).join('');
  return `<h1 class="pagetitle">Team</h1><p class="pagesub">Photos, athletic.net, socials & more.</p>${rows}`;
}

/* ===== MY ATTENDANCE ===== */
function attendanceHTML(){
  const mine=absences.filter(a=>a.name===me).sort((a,b)=>a.date.localeCompare(b.date));
  const active=mine.filter(a=>a.status==='active');
  let list;
  if(!mine.length)list=`<div class="empty-state">You haven't logged any absences.<br>You're expected at every practice.</div>`;
  else list=mine.map(a=>{
    const cls=a.type==='absent'?'absent':a.type==='late'?'late':'early';
    const lbl=a.type==='absent'?'Absent':a.type==='late'?'Late':'Leave early';
    return `<div class="myabs ${a.status==='cancelled'?'cancelled':''}"><span class="tag ${cls}">${lbl}</span>
      <div class="info"><div class="dt">${fmtLong(a.date)}${a.time?` · ${a.time}`:''}</div>
        <div class="rs">${a.reason}${a.status==='cancelled'?' · (cancelled)':''}</div></div>
      ${a.status==='active'?`<button class="btn btn-ghost btn-sm" onclick="openAbsence('${a.date}','${a.id}')">Edit</button>`:''}</div>`;
  }).join('');
  return `<h1 class="pagetitle">My Attendance</h1>
    <p class="pagesub">${active.length?active.length+' upcoming note'+(active.length>1?'s':''):'All clear'} · ${me}</p>
    <button class="btn btn-o" style="width:100%;padding:13px;margin-bottom:16px" onclick="openAbsence('${todayKey}',null)">+ Add an absence / late / early</button>${list}`;
}

/* ===== helpers ===== */
function showModal(){document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
</script>
</body>
</html>
